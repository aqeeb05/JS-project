<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Manager | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>Project Portal</h2>
            <p>Enter your credentials to manage your team.</p>
            <form id="loginForm">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="john@email.com">
                </div>
                <div class="input-group">
                <label>Password</label>
                <div class="password-wrapper">
                <input type="password" id="password" required placeholder="••••••••">
                <!-- We use a simple emoji for the "eye" icon -->
                <span id="togglePassword" class="toggle-icon">👁️</span>
                </div>
        </div>
                <button type="submit" class="login-btn">Sign In</button>
            </form>
            <p id="message"></p>
        </div>
        <!-- Add this right below the Sign In button -->
<div class="signup-link">
    <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
</div>
    </div>
    <script src="login.js"></script>
</body>
</html>
